<!doctype html><html><head><meta charset="utf-8"><title>ZeroCraft</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;font-family:'Segoe UI',sans-serif;-webkit-app-region:drag}
body{background:radial-gradient(ellipse at 50% 30%,#6b3d22 0%,#2a1810 55%,#140c08 100%);display:flex;flex-direction:column;align-items:center;justify-content:center;color:#e8d5b0}
img{width:120px;filter:drop-shadow(0 0 18px rgba(255,170,60,.45))}
h1{font-family:Georgia,serif;letter-spacing:.14em;color:#f0c46a;margin:14px 0 0;font-size:30px;text-shadow:0 2px 8px #000}
p{margin:34px 0 12px;font-size:13px;opacity:.85}
.spin{width:34px;height:34px;border-radius:50%;border:3px solid rgba(240,196,106,.2);border-top-color:#f0c46a;animation:s 1s linear infinite}
@keyframes s{to{transform:rotate(360deg)}}
.v{position:absolute;bottom:14px;font-size:11px;opacity:.45}
</style></head><body>
<img src="emblem.svg"><h1>ZEROCRAFT</h1><p>Launching...</p><div class="spin"></div><div class="v">v1.2.0</div>
</body></html>
