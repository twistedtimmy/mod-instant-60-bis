<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <defs>
    <radialGradient id="bg" cx=".5" cy=".4" r=".62">
      <stop offset="0" stop-color="#3d2416"/><stop offset=".62" stop-color="#180e08"/><stop offset="1" stop-color="#090504"/>
    </radialGradient>
    <radialGradient id="glow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#ff8a2a" stop-opacity=".6"/><stop offset=".6" stop-color="#ff6a1a" stop-opacity=".18"/><stop offset="1" stop-color="#ff6a1a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff2c0"/><stop offset=".3" stop-color="#e6b04a"/><stop offset=".62" stop-color="#8f621a"/><stop offset=".85" stop-color="#d9a640"/><stop offset="1" stop-color="#fbe7a6"/>
    </linearGradient>
    <linearGradient id="goldFlat" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffe9a8"/><stop offset="1" stop-color="#a87524"/>
    </linearGradient>
    <linearGradient id="fire" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe89a"/><stop offset=".38" stop-color="#ff9a2e"/><stop offset=".72" stop-color="#e8541a"/><stop offset="1" stop-color="#9a1c0c"/>
    </linearGradient>
    <linearGradient id="gem" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff8477"/><stop offset=".45" stop-color="#c22a1f"/><stop offset="1" stop-color="#5a0d09"/>
    </linearGradient>
  </defs>

  <!-- obsidian disc with an ember glow low in the centre -->
  <circle cx="128" cy="128" r="119" fill="url(#bg)"/>
  <circle cx="128" cy="146" r="86" fill="url(#glow)"/>

  <!-- beveled gold ring -->
  <circle cx="128" cy="128" r="111" fill="none" stroke="#2a1806" stroke-width="20"/>
  <circle cx="128" cy="128" r="111" fill="none" stroke="url(#gold)" stroke-width="14"/>
  <circle cx="128" cy="128" r="120" fill="none" stroke="#6b4612" stroke-width="2.5"/>
  <circle cx="128" cy="128" r="102" fill="none" stroke="#6b4612" stroke-width="2.5"/>
  <circle cx="128" cy="128" r="111" fill="none" stroke="#fff6d2" stroke-width="1.2" opacity=".35"/>

  <!-- rivets on the ring -->
  <g fill="url(#goldFlat)" stroke="#3a2408" stroke-width="1.6">
    <circle cx="128" cy="17" r="6.5"/>
    <circle cx="239" cy="128" r="6.5"/>
    <circle cx="17" cy="128" r="6.5"/>
    <circle cx="206.5" cy="49.5" r="5.5"/>
    <circle cx="49.5" cy="49.5" r="5.5"/>
    <circle cx="206.5" cy="206.5" r="5.5"/>
    <circle cx="49.5" cy="206.5" r="5.5"/>
  </g>

  <!-- the Z: a blade cut through the zero -->
  <path d="M66 62 H190 L198 74 L192 92 L120 166 H190 V192 H66 L58 180 L64 162 L136 88 H66 Z"
        fill="#2a0a05" opacity=".9" transform="translate(3 4)"/>
  <path d="M66 62 H190 L198 74 L192 92 L120 166 H190 V192 H66 L58 180 L64 162 L136 88 H66 Z"
        fill="url(#fire)" stroke="#3a0c06" stroke-width="5" stroke-linejoin="round"/>
  <!-- edge highlight along the top bar and the blade -->
  <path d="M76 70 H182 L110 158" fill="none" stroke="#fff6cf" stroke-width="3.2" stroke-linecap="round" opacity=".75"/>
  <path d="M84 184 H180" fill="none" stroke="#ffb15a" stroke-width="2" stroke-linecap="round" opacity=".55"/>

  <!-- ruby set into the base of the ring -->
  <path d="M128 208 L150 232 L128 254 L106 232 Z" fill="#2a1806"/>
  <path d="M128 210 L148 232 L128 252 L108 232 Z" fill="url(#gem)" stroke="url(#gold)" stroke-width="4" stroke-linejoin="round"/>
  <path d="M120 226 L128 216 L136 226" fill="none" stroke="#ffd0c8" stroke-width="2" opacity=".8" stroke-linecap="round"/>
</svg>
